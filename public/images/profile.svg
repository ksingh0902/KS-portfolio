<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="avatar-bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </radialGradient>
    <linearGradient id="neon-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#avatar-bg)"/>
  <circle cx="200" cy="200" r="180" fill="none" stroke="url(#neon-glow)" stroke-width="4" stroke-dasharray="8 6"/>
  
  <!-- Silhouette / Senior Engineer Avatar Illustration -->
  <g transform="translate(100, 70)">
    <!-- Head -->
    <circle cx="100" cy="85" r="55" fill="#334155"/>
    <path d="M60 80 Q 100 20, 140 80 Q 130 50, 100 45 Q 70 50, 60 80 Z" fill="#1e293b"/>
    <!-- Glasses -->
    <rect x="70" y="75" width="24" height="14" rx="3" fill="none" stroke="#38bdf8" stroke-width="2.5"/>
    <rect x="106" y="75" width="24" height="14" rx="3" fill="none" stroke="#38bdf8" stroke-width="2.5"/>
    <line x1="94" y1="82" x2="106" y2="82" stroke="#38bdf8" stroke-width="2"/>
    <!-- Body / Blazer -->
    <path d="M20 230 C20 160, 60 150, 100 150 C140 150, 180 160, 180 230 Z" fill="#1e293b"/>
    <path d="M70 150 L100 210 L130 150 Z" fill="#0f172a"/>
    <path d="M90 150 L100 190 L110 150 Z" fill="#38bdf8" opacity="0.7"/>
  </g>
  
  <!-- Code Symbols floating -->
  <text x="50" y="90" fill="#06b6d4" font-family="monospace" font-size="20" opacity="0.6">&lt;/&gt;</text>
  <text x="320" y="110" fill="#3b82f6" font-family="monospace" font-size="18" opacity="0.6">{AI}</text>
  <text x="40" y="320" fill="#8b5cf6" font-family="monospace" font-size="18" opacity="0.6">λ_</text>
  <text x="320" y="320" fill="#10b981" font-family="monospace" font-size="18" opacity="0.6">SQL</text>
</svg>